name: 📚 Docs Preview

# Publishes each pull request's docs to its own surge.sh domain, comments the
# link on the PR, and tears the site down when the PR closes. Pair it with the
# pkg.pr.new comment from Continuous Releases and a PR has both an installable
# package and the docs that describe it.
#
# Needs one repository secret, SURGE_TOKEN: run `npx surge token` locally.

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: docs-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  DOMAIN: sparkstonepdx-css-pr-${{ github.event.pull_request.number }}.surge.sh

jobs:
  deploy:
    name: "📚 Deploy docs preview"
    # Pull requests from forks get no secrets, so they can't deploy.
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          # matches packageManager in package.json
          version: 12.4.2

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Deploy to surge.sh
        run: pnpm exec surge ./docs "$DOMAIN"
        env:
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}

      - name: Comment the preview link
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- docs-preview -->';
            const body = `${marker}\n📚 Docs preview: https://${process.env.DOMAIN}\n\nBuilt from ${context.payload.pull_request.head.sha.slice(0, 7)}.`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.body?.startsWith(marker));
            if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });

  teardown:
    name: "🧹 Tear down docs preview"
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 12.4.2

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Tear down surge.sh site
        run: pnpm exec surge teardown "$DOMAIN"
        env:
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}

      - name: Mark the comment as removed
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- docs-preview -->';
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.body?.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id,
                body: `${marker}\n📚 Docs preview removed: the pull request was closed.`,
              });
            }
