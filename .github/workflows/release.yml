name: 🚀 Release

# On every push to main, opens or updates a "Version Packages" pull request from
# the changesets in .changeset/. Merging that pull request bumps package.json,
# writes CHANGELOG.md, publishes to npm and tags the release.
#
# Publishes with npm trusted publishing (OIDC): no token secret. Set it up once
# on npmjs.com under the package's settings, for this repository and release.yml.

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency: release-${{ github.ref }}

jobs:
  release:
    name: "🚀 Version or publish"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Trusted publishing (OIDC) needs npm 11.5.1 or later; Node's bundled npm can be older.
      - name: Use an npm that can publish with OIDC
        run: npm install -g npm@latest

      # changesets/action v2 goes with the changesets CLI v3 this repo uses. v1 reads the CLI v2's
      # "New tag:" output to find what was published, so with CLI v3 it published but made no git
      # tag or GitHub release.
      - name: Version or publish
        uses: changesets/action@v2
        with:
          publish-script: pnpm release
          pr-title: "Version Packages"
          commit-message: "Version Packages"
          github-token: ${{ secrets.GITHUB_TOKEN }}
