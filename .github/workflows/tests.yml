name: 🧪 Tests

# Renders every docs demo in each build it shows (Class, Classless, Kobalte), in
# light and dark, and fails if any build renders differently from the Class one.
# No stored screenshots, so it needs nothing from outside the repo. The report,
# with screenshots and diffs, is uploaded when it fails.

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  cross-build:
    name: "🧪 Cross-build"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 12.4.2

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Test
        run: pnpm test

      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
